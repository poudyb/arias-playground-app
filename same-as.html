<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Same As — Aria's Playroom</title>
<link rel="stylesheet" href="styles/same-as.css">
</head>
<body>

<div id="play-timer" role="status" aria-live="polite" aria-atomic="true"></div>

<div id="session-end-overlay" aria-modal="true" role="dialog" aria-labelledby="session-end-title" aria-hidden="true">
  <div class="session-end-card">
    <h2 id="session-end-title">Time's up!</h2>
    <p class="session-end-sub">Here's how your matching went!</p>
    <div class="session-end-stats" id="session-end-stats"></div>
    <a href="index.html" class="session-end-home" id="session-end-home">Back to home</a>
  </div>
</div>

<a href="index.html" class="home-btn" id="link-home" aria-label="Back to games">← Home</a>

<div id="category-buttons">
  <button type="button" class="cat-btn active" data-cat="animals">Animals</button>
  <button type="button" class="cat-btn" data-cat="shapes">Shapes</button>
  <button type="button" class="cat-btn" data-cat="memory">Memory</button>
</div>

<main id="app-main">
  <div class="match-board" id="match-board">
    <div class="match-ref-wrap">
      <button type="button" class="match-ref-card" id="ref-card" aria-label="Play the question out loud">
        <span class="match-ref-card__art" id="ref-art" aria-hidden="true"></span>
      </button>
      <div class="match-cue" aria-hidden="true" title="Same">🟰</div>
    </div>
    <div class="match-choices">
      <button type="button" class="match-choice" id="choice-left" aria-label="First choice">
        <span class="match-choice__art" id="choice-left-art"></span>
      </button>
      <button type="button" class="match-choice" id="choice-middle" aria-label="Second choice">
        <span class="match-choice__art" id="choice-middle-art"></span>
      </button>
      <button type="button" class="match-choice" id="choice-right" aria-label="Third choice">
        <span class="match-choice__art" id="choice-right-art"></span>
      </button>
    </div>
  </div>

  <div class="memory-board" id="memory-board" hidden>
    <div class="memory-level" id="memory-level" aria-live="polite"></div>
    <div class="memory-grid" id="memory-grid" aria-label="Memory cards"></div>
  </div>
</main>


<script src="shared/touch-guard.js"></script>
<script src="data/animals.js"></script>
<script src="data/shapes.js"></script>
<script src="shared/feedback.js"></script>
<script src="shared/stats.js"></script>
<script src="shared/speech.js"></script>
<script src="shared/summary.js"></script>
<script src="shared/portal-storage.js"></script>
<script src="shared/session.js"></script>
<script src="shared/hints.js"></script>
<script src="scripts/same-as-page.js"></script>
</body>
</html>
